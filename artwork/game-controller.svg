<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes led-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .led { animation: led-pulse 2s ease-in-out infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- PS5 DualSense controller outline -->
  <g filter="url(#glow)">
    <!-- Main body + grips - PS5 shape: wide top, two grips curving down -->
    <path d="M30,68 
             C30,56 38,48 52,44 
             L72,40 C78,38 85,38 100,38 
             C115,38 122,38 128,40 
             L148,44 C162,48 170,56 170,68 
             L172,78 C174,88 168,96 160,100 
             L152,104 C148,106 146,110 144,116 
             L140,132 C138,140 134,148 128,154 
             C122,160 116,164 108,166 
             L100,168 L92,166 
             C84,164 78,160 72,154 
             C66,148 62,140 60,132 
             L56,116 C54,110 52,106 48,104 
             L40,100 C32,96 26,88 28,78 Z" 
          fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Touchpad (center) -->
  <rect x="82" y="52" width="36" height="22" rx="4" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.5"/>

  <!-- D-pad area -->
  <g filter="url(#glow)">
    <rect x="52" y="68" width="8" height="20" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1"/>
    <rect x="44" y="76" width="24" height="8" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1"/>
  </g>

  <!-- Face buttons (△○✕□) -->
  <g filter="url(#glow)">
    <circle cx="140" cy="72" r="5" fill="none" stroke="#FFB74D" stroke-width="0.8"/>
    <text x="140" y="75" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#FFB74D">△</text>

    <circle cx="152" cy="82" r="5" fill="none" stroke="#EF5350" stroke-width="0.8"/>
    <text x="152" y="85.5" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#EF5350">○</text>

    <circle cx="128" cy="82" r="5" fill="none" stroke="#42A5F5" stroke-width="0.8"/>
    <text x="128" y="85.5" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#42A5F5">✕</text>

    <circle cx="140" cy="92" r="5" fill="none" stroke="#66BB6A" stroke-width="0.8"/>
    <text x="140" y="95.5" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#66BB6A">□</text>
  </g>

  <!-- Analog sticks -->
  <circle cx="78" cy="108" r="8" fill="none" stroke="#c9d1d9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="78" cy="108" r="3" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="122" cy="108" r="8" fill="none" stroke="#c9d1d9" stroke-width="0.8" opacity="0.5"/>
  <circle cx="122" cy="108" r="3" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>

  <!-- Start / Options buttons -->
  <ellipse cx="88" cy="60" rx="4" ry="2" fill="none" stroke="#c9d1d9" stroke-width="0.6" opacity="0.4"/>
  <ellipse cx="112" cy="60" rx="4" ry="2" fill="none" stroke="#c9d1d9" stroke-width="0.6" opacity="0.4"/>

  <!-- PS button -->
  <circle cx="100" cy="108" r="4" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>

  <!-- LED bar (top) -->
  <line x1="85" y1="42" x2="115" y2="42" stroke="#00D4FF" stroke-width="1.5" opacity="0.3" class="led"/>

  <!-- Shoulder buttons (L1/R1) -->
  <path d="M34,62 L30,68 L28,72" fill="none" stroke="#c9d1d9" stroke-width="0.8" opacity="0.4"/>
  <path d="M166,62 L170,68 L172,72" fill="none" stroke="#c9d1d9" stroke-width="0.8" opacity="0.4"/>
</svg>
