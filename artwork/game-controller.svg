<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes led-blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0.15; }
        100% { opacity: 1; }
      }
      @keyframes button-press {
        0%, 80%, 100% { transform: scale(1); }
        85% { transform: scale(0.92); }
      }
      @keyframes screen-flicker {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .led { animation: led-blink 2s ease-in-out infinite; }
      .btn-a { animation: button-press 3s ease-in-out infinite; }
      .btn-b { animation: button-press 3s ease-in-out 0.5s infinite; }
      .screen { animation: screen-flicker 1.5s ease-in-out infinite; }
    </style>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="btn-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="led-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- Controller body - rounded ergonomic shape -->
  <path d="M40,75 Q40,55 60,50 L140,50 Q160,55 160,75 L165,110 Q165,135 150,145 L140,150 Q120,155 115,160 L115,165 Q115,170 110,170 L90,170 Q85,170 85,165 L85,160 Q80,155 60,150 L50,145 Q35,135 35,110 Z" 
        fill="url(#body-grad)" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Inner body highlight -->
  <path d="M55,65 Q55,58 68,55 L132,55 Q145,58 145,65 L148,100 Q148,115 140,122" 
        fill="none" stroke="#2d3548" stroke-width="0.8" opacity="0.5"/>

  <!-- D-pad -->
  <g filter="url(#btn-glow)">
    <!-- Vertical bar -->
    <rect x="56" y="82" width="14" height="40" rx="3" fill="#2d3548" stroke="#404858" stroke-width="0.8"/>
    <rect x="58" y="84" width="10" height="36" rx="2" fill="#363f52"/>
    <!-- Horizontal bar -->
    <rect x="43" y="93" width="40" height="14" rx="3" fill="#2d3548" stroke="#404858" stroke-width="0.8"/>
    <rect x="45" y="95" width="36" height="10" rx="2" fill="#363f52"/>
    <!-- Center circle -->
    <circle cx="63" cy="100" r="3" fill="#2a3142"/>
    <!-- Arrows -->
    <text x="63" y="91" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#c9d1d9" opacity="0.5">▲</text>
    <text x="63" y="114" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#c9d1d9" opacity="0.5">▼</text>
    <text x="49" y="103" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#c9d1d9" opacity="0.5">◀</text>
    <text x="77" y="103" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#c9d1d9" opacity="0.5">▶</text>
  </g>

  <!-- Face buttons -->
  <g class="btn-a" filter="url(#btn-glow)">
    <circle cx="140" cy="85" r="9" fill="#1a2030" stroke="#00D4FF" stroke-width="1.2"/>
    <circle cx="140" cy="85" r="6.5" fill="url(#btn-grad)"/>
    <text x="140" y="88.5" text-anchor="middle" font-family="'Fira Code',monospace" font-size="8" font-weight="bold" fill="#0d1117">A</text>
  </g>
  <g class="btn-b" filter="url(#btn-glow)">
    <circle cx="155" cy="100" r="9" fill="#1a2030" stroke="#0088FF" stroke-width="1.2"/>
    <circle cx="155" cy="100" r="6.5" fill="#0088FF" opacity="0.8"/>
    <text x="155" y="103.5" text-anchor="middle" font-family="'Fira Code',monospace" font-size="8" font-weight="bold" fill="#0d1117">B</text>
  </g>
  <g filter="url(#btn-glow)">
    <circle cx="130" cy="102" r="9" fill="#1a2030" stroke="#4CAF50" stroke-width="1.2"/>
    <circle cx="130" cy="102" r="6.5" fill="#4CAF50" opacity="0.8"/>
    <text x="130" y="105.5" text-anchor="middle" font-family="'Fira Code',monospace" font-size="8" font-weight="bold" fill="#0d1117">X</text>
  </g>
  <g filter="url(#btn-glow)">
    <circle cx="145" cy="115" r="9" fill="#1a2030" stroke="#FF5252" stroke-width="1.2"/>
    <circle cx="145" cy="115" r="6.5" fill="#FF5252" opacity="0.8"/>
    <text x="145" y="118.5" text-anchor="middle" font-family="'Fira Code',monospace" font-size="8" font-weight="bold" fill="#0d1117">Y</text>
  </g>

  <!-- Start / Select buttons -->
  <ellipse cx="90" cy="112" rx="7" ry="3.5" fill="#2a3142" stroke="#404858" stroke-width="0.6"/>
  <ellipse cx="110" cy="112" rx="7" ry="3.5" fill="#2a3142" stroke="#404858" stroke-width="0.6"/>
  <text x="90" y="113.5" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#8b949e">SEL</text>
  <text x="110" y="113.5" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#8b949e">START</text>

  <!-- Home button -->
  <circle cx="100" cy="125" r="4" fill="#1a2030" stroke="#30363d" stroke-width="0.8"/>

  <!-- LED indicator -->
  <circle cx="100" cy="62" r="2.5" fill="#00D4FF" filter="url(#led-glow)" class="led"/>

  <!-- Grip texture -->
  <g opacity="0.3">
    <line x1="42" y1="140" x2="50" y2="140" stroke="#404858" stroke-width="0.8"/>
    <line x1="40" y1="143" x2="48" y2="143" stroke="#404858" stroke-width="0.8"/>
    <line x1="38" y1="146" x2="46" y2="146" stroke="#404858" stroke-width="0.8"/>
    <line x1="150" y1="140" x2="158" y2="140" stroke="#404858" stroke-width="0.8"/>
    <line x1="152" y1="143" x2="160" y2="143" stroke="#404858" stroke-width="0.8"/>
    <line x1="154" y1="146" x2="162" y2="146" stroke="#404858" stroke-width="0.8"/>
  </g>
</svg>
