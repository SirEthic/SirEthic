<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes led-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes scanline {
        0% { transform: translateY(-200px); }
        100% { transform: translateY(200px); }
      }
      .led { animation: led-pulse 2s ease-in-out infinite; }
      .scan { animation: scanline 6s linear infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- Scanline effect -->
  <g class="scan" opacity="0.03">
    <rect x="0" y="0" width="200" height="2" fill="#00D4FF"/>
    <rect x="0" y="40" width="200" height="2" fill="#00D4FF"/>
    <rect x="0" y="80" width="200" height="2" fill="#00D4FF"/>
    <rect x="0" y="120" width="200" height="2" fill="#00D4FF"/>
    <rect x="0" y="160" width="200" height="2" fill="#00D4FF"/>
  </g>

  <!-- Controller wireframe outline -->
  <g filter="url(#glow)">
    <path d="M38,72 C38,55 50,48 65,46 L135,46 C150,48 162,55 162,72 
             L168,108 C170,128 158,142 145,148 
             L130,156 C120,160 118,168 115,172 L100,178 
             L85,172 C82,168 80,160 70,156 
             L55,148 C42,142 30,128 32,108 Z" 
          fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- D-pad wireframe -->
  <g filter="url(#soft-glow)">
    <rect x="54" y="80" width="10" height="32" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
    <rect x="44" y="90" width="30" height="12" rx="2" fill="none" stroke="#c9d1d9" stroke-width="1.2"/>
    <circle cx="59" cy="96" r="2" fill="#c9d1d9" opacity="0.4"/>
  </g>

  <!-- Face buttons - clean wireframe -->
  <g filter="url(#soft-glow)">
    <circle cx="138" cy="82" r="7" fill="none" stroke="#00D4FF" stroke-width="1.2"/>
    <text x="138" y="85.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00D4FF">A</text>

    <circle cx="152" cy="96" r="7" fill="none" stroke="#0088FF" stroke-width="1.2"/>
    <text x="152" y="99.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#0088FF">B</text>

    <circle cx="124" cy="96" r="7" fill="none" stroke="#4FC3F7" stroke-width="1.2"/>
    <text x="124" y="99.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#4FC3F7">X</text>

    <circle cx="138" cy="110" r="7" fill="none" stroke="#80DEEA" stroke-width="1.2"/>
    <text x="138" y="113.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#80DEEA">Y</text>
  </g>

  <!-- Start / Select -->
  <ellipse cx="88" cy="115" rx="6" ry="2.5" fill="none" stroke="#c9d1d9" stroke-width="0.8" opacity="0.6"/>
  <ellipse cx="112" cy="115" rx="6" ry="2.5" fill="none" stroke="#c9d1d9" stroke-width="0.8" opacity="0.6"/>

  <!-- LED -->
  <circle cx="100" cy="58" r="2" fill="#00D4FF" filter="url(#glow)" class="led"/>

  <!-- Subtle inner body lines -->
  <line x1="65" y1="50" x2="65" y2="70" stroke="#00D4FF" stroke-width="0.3" opacity="0.15"/>
  <line x1="135" y1="50" x2="135" y2="70" stroke="#00D4FF" stroke-width="0.3" opacity="0.15"/>

  <!-- Grip lines -->
  <g opacity="0.2" stroke="#c9d1d9" stroke-width="0.6">
    <line x1="40" y1="138" x2="50" y2="138"/>
    <line x1="38" y1="141" x2="48" y2="141"/>
    <line x1="36" y1="144" x2="46" y2="144"/>
    <line x1="150" y1="138" x2="160" y2="138"/>
    <line x1="152" y1="141" x2="162" y2="141"/>
    <line x1="154" y1="144" x2="164" y2="144"/>
  </g>
</svg>
