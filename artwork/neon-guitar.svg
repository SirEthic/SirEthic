<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes string-shimmer {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      .shimmer { animation: string-shimmer 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- Stratocaster body - double cutaway, asymmetric horns -->
  <g filter="url(#glow)">
    <path d="M68,72 
             C64,70 58,68 52,70 
             C44,72 38,78 34,88 
             C30,98 28,108 30,118 
             C32,128 36,138 44,146 
             C52,154 62,160 74,164 
             C86,168 96,170 106,170 
             C116,170 126,168 136,162 
             C146,156 154,148 158,138 
             C162,128 164,118 162,108 
             C160,98 156,90 148,84 
             C142,80 136,78 128,78 
             L120,82 
             C116,84 114,88 114,94 
             L114,98 
             C114,98 112,96 108,94 
             L96,88 
             C90,86 84,82 80,78 
             L68,72 Z" 
          fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Neck -->
  <g filter="url(#soft-glow)">
    <rect x="93" y="18" width="10" height="62" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2"/>
  </g>

  <!-- Headstock - Strat style with 6 inline pegs -->
  <path d="M91,18 L88,8 C88,4 90,2 94,2 L106,2 C110,2 112,4 112,8 L109,18" 
        fill="none" stroke="#00D4FF" stroke-width="1.2"/>
  
  <!-- Tuning pegs (6 inline) -->
  <g filter="url(#soft-glow)">
    <circle cx="86" cy="6" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.7"/>
    <circle cx="86" cy="11" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.7"/>
    <circle cx="86" cy="16" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.7"/>
    <circle cx="84" cy="6" r="1" fill="#c9d1d9" opacity="0.4"/>
    <circle cx="84" cy="11" r="1" fill="#c9d1d9" opacity="0.4"/>
    <circle cx="84" cy="16" r="1" fill="#c9d1d9" opacity="0.4"/>
  </g>

  <!-- Nut -->
  <line x1="93" y1="18" x2="103" y2="18" stroke="#c9d1d9" stroke-width="1"/>

  <!-- Fret markers -->
  <g opacity="0.4">
    <circle cx="98" cy="28" r="1" fill="#00D4FF"/>
    <circle cx="98" cy="40" r="1" fill="#00D4FF"/>
    <circle cx="98" cy="52" r="1" fill="#00D4FF"/>
    <circle cx="98" cy="64" r="1" fill="#00D4FF"/>
  </g>

  <!-- Pickups (3 single coils - Strat style) -->
  <g opacity="0.5">
    <rect x="78" y="105" width="36" height="3" rx="1.5" fill="none" stroke="#00D4FF" stroke-width="0.6"/>
    <rect x="78" y="118" width="36" height="3" rx="1.5" fill="none" stroke="#00D4FF" stroke-width="0.6"/>
    <rect x="78" y="131" width="36" height="3" rx="1.5" fill="none" stroke="#00D4FF" stroke-width="0.6"/>
  </g>

  <!-- Pickup selector -->
  <circle cx="140" cy="120" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>

  <!-- Bridge -->
  <rect x="82" y="142" width="28" height="4" rx="1" fill="none" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>

  <!-- Volume/Tone knobs -->
  <circle cx="130" cy="135" r="4" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="130" cy="148" r="4" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="130" cy="161" r="4" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>

  <!-- Strings -->
  <g class="shimmer" filter="url(#soft-glow)">
    <line x1="94" y1="20" x2="94" y2="146" stroke="#c9d1d9" stroke-width="0.3"/>
    <line x1="96" y1="20" x2="96" y2="146" stroke="#c9d1d9" stroke-width="0.35"/>
    <line x1="98" y1="20" x2="98" y2="146" stroke="#c9d1d9" stroke-width="0.4"/>
    <line x1="100" y1="20" x2="100" y2="146" stroke="#c9d1d9" stroke-width="0.45"/>
    <line x1="102" y1="20" x2="102" y2="146" stroke="#c9d1d9" stroke-width="0.35"/>
    <line x1="104" y1="20" x2="104" y2="146" stroke="#c9d1d9" stroke-width="0.3"/>
  </g>

  <!-- Output jack -->
  <circle cx="156" cy="158" r="2.5" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
</svg>
