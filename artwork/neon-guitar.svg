<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes string-hum {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      .hum { animation: string-hum 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- Guitar body - single cutaway Les Paul wireframe -->
  <g filter="url(#glow)">
    <path d="M92,82 
             Q90,78 82,76 Q68,74 58,80 
             Q46,88 42,105 
             Q38,122 44,138 
             Q50,152 62,160 
             Q75,168 90,170 
             L100,172 L110,170 
             Q125,168 138,160 
             Q150,152 156,138 
             Q162,122 158,105 
             Q154,88 142,80 
             Q132,74 118,76 
             Q110,78 108,82 Z" 
          fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cutaway -->
  <path d="M108,82 Q114,90 116,102 Q116,112 112,120" 
        fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.5"/>

  <!-- Neck wireframe -->
  <g filter="url(#soft-glow)">
    <rect x="94" y="22" width="12" height="60" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2"/>
  </g>

  <!-- Headstock -->
  <path d="M92,22 L90,12 Q90,6 95,6 L105,6 Q110,6 110,12 L108,22" 
        fill="none" stroke="#00D4FF" stroke-width="1.2"/>

  <!-- Tuning pegs -->
  <g filter="url(#soft-glow)">
    <circle cx="87" cy="10" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.8"/>
    <circle cx="87" cy="16" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.8"/>
    <circle cx="113" cy="10" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.8"/>
    <circle cx="113" cy="16" r="2" fill="none" stroke="#c9d1d9" stroke-width="0.8"/>
  </g>

  <!-- Nut -->
  <line x1="94" y1="22" x2="106" y2="22" stroke="#c9d1d9" stroke-width="1"/>

  <!-- Fret markers -->
  <g opacity="0.4">
    <circle cx="100" cy="32" r="1" fill="#00D4FF"/>
    <circle cx="100" cy="44" r="1" fill="#00D4FF"/>
    <circle cx="100" cy="56" r="1" fill="#00D4FF"/>
    <circle cx="100" cy="68" r="1" fill="#00D4FF"/>
  </g>

  <!-- Sound hole -->
  <circle cx="96" cy="115" r="10" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.3"/>

  <!-- Pickups -->
  <rect x="82" y="120" width="28" height="3" rx="1" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>
  <rect x="82" y="130" width="28" height="3" rx="1" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>

  <!-- Bridge -->
  <rect x="84" y="145" width="24" height="2.5" rx="1" fill="none" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>

  <!-- Strings -->
  <g class="hum" filter="url(#soft-glow)">
    <line x1="95" y1="24" x2="95" y2="148" stroke="#c9d1d9" stroke-width="0.3"/>
    <line x1="97" y1="24" x2="97" y2="148" stroke="#c9d1d9" stroke-width="0.4"/>
    <line x1="99" y1="24" x2="99" y2="148" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="101" y1="24" x2="101" y2="148" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="103" y1="24" x2="103" y2="148" stroke="#c9d1d9" stroke-width="0.4"/>
    <line x1="105" y1="24" x2="105" y2="148" stroke="#c9d1d9" stroke-width="0.3"/>
  </g>

  <!-- Knobs -->
  <circle cx="120" cy="150" r="3" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="132" cy="145" r="3" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="126" cy="158" r="3" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="138" cy="153" r="3" fill="none" stroke="#c9d1d9" stroke-width="0.5" opacity="0.3"/>
</svg>
