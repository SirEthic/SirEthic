<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .animated-neon {
        animation: float 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <g class="animated-neon" filter="url(#glow)" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-linejoin="round">
    <!-- Outer Body -->
    <path d="M 92,110
             C 80,110 65,80 60,70
             C 65,80 75,110 65,125
             C 50,130 35,150 45,170
             C 55,190 85,195 100,195
             C 115,195 145,190 155,170
             C 165,150 150,130 135,125
             C 125,110 135,80 140,75
             C 135,85 120,110 108,110
             Z" />
             
    <!-- Inner Body -->
    <path d="M 92,116
             C 84,116 72,90 68,82
             C 72,92 80,115 72,127
             C 59,132 46,150 54,166
             C 62,182 88,187 100,187
             C 112,187 138,182 146,166
             C 154,150 141,132 128,127
             C 120,115 128,92 132,86
             C 128,90 116,116 108,116
             Z" stroke-width="1.0" />

    <!-- Neck Outline -->
    <rect x="92" y="30" width="16" height="80" />

    <!-- Frets -->
    <path d="M 92,35 L 108,35 M 92,42 L 108,42 M 92,49 L 108,49 M 92,56 L 108,56 M 92,63 L 108,63 M 92,70 L 108,70 M 92,77 L 108,77 M 92,84 L 108,84 M 92,91 L 108,91 M 92,98 L 108,98 M 92,105 L 108,105" stroke-width="1.0" />

    <!-- Headstock -->
    <path d="M 92,30 
             L 86,18
             C 84,14 85,10 88,8
             L 108,12
             C 106,18 108,25 108,30 Z" />

    <!-- Pickups -->
    <rect x="85" y="120" width="30" height="12" rx="2" />
    <rect x="85" y="140" width="30" height="12" rx="2" />
    
    <!-- Bridge -->
    <rect x="83" y="160" width="34" height="10" rx="2" />
    
    <!-- Knobs (Outer Circles) -->
    <circle cx="130" cy="145" r="5" />
    <circle cx="140" cy="160" r="5" />
    <circle cx="130" cy="175" r="5" />
  </g>

  <!-- Dots and Fills (Also glowing) -->
  <g class="animated-neon" filter="url(#glow)" fill="#00D4FF">
    <!-- Pickup 1 Dots -->
    <circle cx="89" cy="126" r="1.5" />
    <circle cx="94.5" cy="126" r="1.5" />
    <circle cx="100" cy="126" r="1.5" />
    <circle cx="105.5" cy="126" r="1.5" />
    <circle cx="111" cy="126" r="1.5" />
    
    <!-- Pickup 2 Dots -->
    <circle cx="89" cy="146" r="1.5" />
    <circle cx="94.5" cy="146" r="1.5" />
    <circle cx="100" cy="146" r="1.5" />
    <circle cx="105.5" cy="146" r="1.5" />
    <circle cx="111" cy="146" r="1.5" />

    <!-- Bridge Dots -->
    <circle cx="87.5" cy="165" r="1.5" />
    <circle cx="92.5" cy="165" r="1.5" />
    <circle cx="97.5" cy="165" r="1.5" />
    <circle cx="102.5" cy="165" r="1.5" />
    <circle cx="107.5" cy="165" r="1.5" />
    <circle cx="112.5" cy="165" r="1.5" />

    <!-- Knob Center Dots -->
    <circle cx="130" cy="145" r="1.5" />
    <circle cx="140" cy="160" r="1.5" />
    <circle cx="130" cy="175" r="1.5" />

    <!-- Tuning Pegs -->
    <circle cx="83" cy="28" r="1.5" />
    <circle cx="81.5" cy="24" r="1.5" />
    <circle cx="80" cy="20" r="1.5" />
    <circle cx="80.5" cy="16" r="1.5" />
    <circle cx="83" cy="12" r="1.5" />
    <circle cx="85.5" cy="8" r="1.5" />
  </g>

</svg>
