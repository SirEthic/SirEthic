<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes neon-pulse {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #00D4FF); }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #00D4FF) drop-shadow(0 0 20px #0088FF); }
      }
      .neon { animation: neon-pulse 2s ease-in-out infinite; }
      @keyframes string-vibrate {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(0.5px); }
        75% { transform: translateX(-0.5px); }
      }
      .vibrate { animation: string-vibrate 0.15s linear infinite; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- Guitar body (Les Paul style) -->
  <g class="neon" filter="url(#glow)">
    <!-- Neck -->
    <rect x="96" y="20" width="8" height="80" rx="2" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    
    <!-- Frets -->
    <line x1="96" y1="35" x2="104" y2="35" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
    <line x1="96" y1="50" x2="104" y2="50" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
    <line x1="96" y1="65" x2="104" y2="65" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>
    <line x1="96" y1="80" x2="104" y2="80" stroke="#00D4FF" stroke-width="0.5" opacity="0.6"/>

    <!-- Headstock -->
    <path d="M92,20 L92,10 Q92,5 97,5 L103,5 Q108,5 108,10 L108,20" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    
    <!-- Tuning pegs -->
    <circle cx="90" cy="12" r="2" fill="#00D4FF" opacity="0.7"/>
    <circle cx="90" cy="18" r="2" fill="#00D4FF" opacity="0.7"/>
    <circle cx="110" cy="12" r="2" fill="#00D4FF" opacity="0.7"/>
    <circle cx="110" cy="18" r="2" fill="#00D4FF" opacity="0.7"/>

    <!-- Body (upper bout) -->
    <ellipse cx="100" cy="110" rx="35" ry="25" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    
    <!-- Body (lower bout) -->
    <ellipse cx="100" cy="145" rx="40" ry="30" fill="none" stroke="#00D4FF" stroke-width="1.5"/>

    <!-- Waist -->
    <path d="M65,115 Q65,130 60,140" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <path d="M135,115 Q135,130 140,140" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>

    <!-- Sound hole -->
    <circle cx="100" cy="125" r="10" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>

    <!-- Bridge -->
    <rect x="90" y="155" width="20" height="3" rx="1" fill="#00D4FF" opacity="0.8"/>

    <!-- Pickups -->
    <rect x="88" y="135" width="24" height="4" rx="1" fill="#00D4FF" opacity="0.5"/>
    <rect x="88" y="145" width="24" height="4" rx="1" fill="#00D4FF" opacity="0.5"/>
  </g>

  <!-- Strings -->
  <g class="vibrate">
    <line x1="97" y1="25" x2="97" y2="158" stroke="#c9d1d9" stroke-width="0.5" opacity="0.8"/>
    <line x1="99" y1="25" x2="99" y2="158" stroke="#c9d1d9" stroke-width="0.5" opacity="0.8"/>
    <line x1="101" y1="25" x2="101" y2="158" stroke="#c9d1d9" stroke-width="0.5" opacity="0.8"/>
    <line x1="103" y1="25" x2="103" y2="158" stroke="#c9d1d9" stroke-width="0.5" opacity="0.8"/>
  </g>

  <!-- Decorative code symbols -->
  <text x="25" y="180" font-family="'Fira Code',monospace" font-size="10" fill="#00D4FF" opacity="0.3">&lt;/&gt;</text>
  <text x="155" y="30" font-family="'Fira Code',monospace" font-size="10" fill="#00D4FF" opacity="0.3">{ }</text>
</svg>
