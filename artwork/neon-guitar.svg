<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @keyframes neon-pulse {
        0%, 100% { filter: drop-shadow(0 0 3px #00D4FF) drop-shadow(0 0 6px rgba(0,212,255,0.3)); }
        50% { filter: drop-shadow(0 0 6px #00D4FF) drop-shadow(0 0 12px rgba(0,212,255,0.5)) drop-shadow(0 0 20px rgba(0,136,255,0.2)); }
      }
      @keyframes string-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .neon { animation: neon-pulse 2.5s ease-in-out infinite; }
      .string-glow { animation: string-glow 3s ease-in-out infinite; }
    </style>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-subtle">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="neck-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="body-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0d1117" rx="12"/>

  <!-- Guitar outline group with neon pulse -->
  <g class="neon">

    <!-- Headstock -->
    <path d="M91,18 L91,6 Q91,1 96,1 L104,1 Q109,1 109,6 L109,18" 
          fill="none" stroke="#00D4FF" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Tuning pegs - left -->
    <circle cx="88" cy="6" r="2.5" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <circle cx="88" cy="12" r="2.5" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <circle cx="88" cy="18" r="2.5" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <!-- Tuning pegs - right -->
    <circle cx="112" cy="6" r="2.5" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <circle cx="112" cy="12" r="2.5" fill="none" stroke="#00D4FF" stroke-width="1"/>
    <circle cx="112" cy="18" r="2.5" fill="none" stroke="#00D4FF" stroke-width="1"/>
    
    <!-- Nut -->
    <line x1="92" y1="20" x2="108" y2="20" stroke="#c9d1d9" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="94" y="20" width="12" height="70" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    
    <!-- Fret markers -->
    <circle cx="100" cy="32" r="1.2" fill="#00D4FF" opacity="0.5"/>
    <circle cx="100" cy="48" r="1.2" fill="#00D4FF" opacity="0.5"/>
    <circle cx="100" cy="64" r="1.2" fill="#00D4FF" opacity="0.5"/>
    <circle cx="100" cy="78" r="1.2" fill="#00D4FF" opacity="0.5"/>
    
    <!-- Frets -->
    <line x1="94" y1="36" x2="106" y2="36" stroke="#00D4FF" stroke-width="0.4" opacity="0.4"/>
    <line x1="94" y1="52" x2="106" y2="52" stroke="#00D4FF" stroke-width="0.4" opacity="0.4"/>
    <line x1="94" y1="66" x2="106" y2="66" stroke="#00D4FF" stroke-width="0.4" opacity="0.4"/>

    <!-- Body - single cutaway Les Paul shape -->
    <path d="M94,90 
             Q94,88 92,86 Q80,80 68,85 
             Q52,92 48,108 
             Q44,125 50,140 
             Q56,155 70,162 
             Q85,168 100,168 
             Q115,168 130,162 
             Q144,155 150,140 
             Q156,125 152,108 
             Q148,92 132,85 
             Q120,80 108,86 
             Q106,88 106,90 Z" 
          fill="none" stroke="#00D4FF" stroke-width="1.8"/>

    <!-- Cutaway (right side) -->
    <path d="M108,86 Q115,95 115,108 Q115,118 112,125" 
          fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>

    <!-- Pickguard -->
    <path d="M75,100 Q68,108 66,120 Q65,130 70,138 Q75,142 82,140" 
          fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.3"/>

    <!-- Pickups -->
    <rect x="78" y="115" width="44" height="5" rx="2" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.6"/>
    <rect x="78" y="130" width="44" height="5" rx="2" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.6"/>
    <!-- Pole pieces -->
    <g opacity="0.5">
      <circle cx="84" cy="117.5" r="0.8" fill="#00D4FF"/><circle cx="90" cy="117.5" r="0.8" fill="#00D4FF"/>
      <circle cx="96" cy="117.5" r="0.8" fill="#00D4FF"/><circle cx="102" cy="117.5" r="0.8" fill="#00D4FF"/>
      <circle cx="108" cy="117.5" r="0.8" fill="#00D4FF"/><circle cx="114" cy="117.5" r="0.8" fill="#00D4FF"/>
      <circle cx="84" cy="132.5" r="0.8" fill="#00D4FF"/><circle cx="90" cy="132.5" r="0.8" fill="#00D4FF"/>
      <circle cx="96" cy="132.5" r="0.8" fill="#00D4FF"/><circle cx="102" cy="132.5" r="0.8" fill="#00D4FF"/>
      <circle cx="108" cy="132.5" r="0.8" fill="#00D4FF"/><circle cx="114" cy="132.5" r="0.8" fill="#00D4FF"/>
    </g>

    <!-- Bridge & Tailpiece -->
    <rect x="85" y="148" width="30" height="4" rx="1.5" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.7"/>
    <rect x="88" y="155" width="24" height="3" rx="1" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>

    <!-- Volume/Tone knobs -->
    <circle cx="125" cy="150" r="4" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>
    <circle cx="135" cy="142" r="4" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>
    <circle cx="130" cy="158" r="4" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>
    <circle cx="140" cy="150" r="4" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>

    <!-- Output jack -->
    <circle cx="148" cy="162" r="2.5" fill="none" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Strings with subtle glow -->
  <g class="string-glow" filter="url(#glow-subtle)">
    <line x1="96" y1="22" x2="96" y2="150" stroke="#c9d1d9" stroke-width="0.4" opacity="0.7"/>
    <line x1="98" y1="22" x2="98" y2="150" stroke="#c9d1d9" stroke-width="0.5" opacity="0.7"/>
    <line x1="100" y1="22" x2="100" y2="150" stroke="#c9d1d9" stroke-width="0.6" opacity="0.8"/>
    <line x1="102" y1="22" x2="102" y2="150" stroke="#c9d1d9" stroke-width="0.5" opacity="0.7"/>
    <line x1="104" y1="22" x2="104" y2="150" stroke="#c9d1d9" stroke-width="0.4" opacity="0.7"/>
    <line x1="106" y1="22" x2="106" y2="150" stroke="#c9d1d9" stroke-width="0.3" opacity="0.6"/>
  </g>

  <!-- Decorative code symbols floating around -->
  <text x="18" y="185" font-family="'Fira Code',monospace" font-size="9" fill="#00D4FF" opacity="0.15">&lt;/&gt;</text>
  <text x="160" y="25" font-family="'Fira Code',monospace" font-size="9" fill="#00D4FF" opacity="0.15">{ }</text>
  <text x="15" y="40" font-family="'Fira Code',monospace" font-size="7" fill="#00D4FF" opacity="0.1">( )</text>
  <text x="168" y="185" font-family="'Fira Code',monospace" font-size="7" fill="#00D4FF" opacity="0.1">[ ]</text>
</svg>
